@if (!esPantallaLogin()) {
  <header class="header">
    <div class="header-container">
      <a class="brand" [routerLink]="config.brand.homeUrl" (click)="closeMenu()">
        {{ config.brand.name }}
      </a>

      @if (mostrarNavegacion()) {
        <button
          class="menu-toggle"
          type="button"
          [attr.aria-expanded]="isMenuOpen()"
          aria-controls="navegacion-principal"
          aria-label="Abrir o cerrar navegación"
          (click)="toggleMenu()"
        >
          <span></span>
          <span></span>
          <span></span>
        </button>

        <nav id="navegacion-principal" class="nav" aria-label="Navegación del catálogo" [class.nav-open]="isMenuOpen()">
          <div class="nav-links">
          @for (item of navegacion(); track item.label) {
            <a class="nav-link" [routerLink]="item.href" (click)="closeMenu()">
              {{ item.label }}
            </a>
          }
          </div>

          <div class="session-actions">
          @if (usuario()) {
            <span class="session-user">
              {{ nombreMostrar() }}
            </span>
          }

          @if (esModoMock()) {
            <span hlmBadge variant="outline">Demo</span>
          }

          <button hlmBtn variant="outline" size="sm" class="logout-button" type="button" (click)="cerrarSesion()">
            Cerrar sesión
          </button>
          </div>
        </nav>
      }
    </div>
  </header>
}
