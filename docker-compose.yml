services:
  backend:
    build: ./backend
    ports:
      - "8300:8300"
    volumes:
      - backend-data:/app/data
    environment:
      AUTOCONFIG_SECRETS__SECRET_KEY: ${SECRET_KEY:?Falta SECRET_KEY. Copiá .env.example a .env y completalo (ver README)}
      AUTOCONFIG_SECRETS__CLAVE_JWT: ${CLAVE_JWT:?Falta CLAVE_JWT. Copiá .env.example a .env y completalo (ver README)}
      AUTOCONFIG_AUTH__JWT__HABILITADO: "true"

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  backend-data: